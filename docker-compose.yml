# docker-compose.yml
version: '3.8' # Use a recent version

services:
  # The Flask Application Service (will run multiple instances)
  app:
    build:
      context: .          # Use the current directory as the build context
      dockerfile: Dockerfile.app # Specify the Dockerfile for the app
    # image: your-dockerhub-username/ocr-app:latest # Optionally push/pull from a registry
    # restart: unless-stopped # Restart policy
    container_name: ocr_app_instance # Base name, compose adds number suffix
    env_file:
      - .env            # Load environment variables from .env file
    # volumes:
      # - ./uploads:/app/uploads # Persist uploads if needed across restarts (usually not for temp files)
    networks:
      - ocr_network     # Connect to the custom network

    # !! IMPORTANT FOR MONGODB ACCESS !!
    # Ensure MONGO_HOST in your .env file is reachable from the Docker container.
    # - If MongoDB is running on your HOST machine (Docker Desktop): Use host.docker.internal
    #   MONGO_HOST="host.docker.internal"
    # - If MongoDB is running on your HOST machine (Linux): Find your Docker bridge IP (e.g., `ip addr show docker0`) and use that.
    #   MONGO_HOST="172.17.0.1" # Example, check your actual IP
    # - If MongoDB is ALSO a Docker container in this compose file: Use the MongoDB service name.
    #   MONGO_HOST="mongodb_service_name"
    # - If MongoDB is external (like your 18.60.111.115): Ensure containers have network access to it.
    #   MONGO_HOST="18.60.111.115" # (As you have it)

    deploy:
      replicas: 3       # <-- Run 3 instances of the Flask app

  # The Nginx Load Balancer Service
  nginx:
    image: nginx:1.25-alpine # Use official Nginx image
    container_name: ocr_nginx_lb
    # restart: unless-stopped
    ports:
      - "5000:80"       # Map Host Port 5000 to Nginx Container Port 80
                        # Access the app via http://<your-host-ip>:5000
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Mount custom config (read-only)
    networks:
      - ocr_network
    depends_on:
      - app             # Wait for the 'app' service to be started (doesn't guarantee readiness)

# Define the custom network
networks:
  ocr_network:
    driver: bridge      # Use the default bridge driver