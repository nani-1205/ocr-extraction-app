# nginx.conf

worker_processes auto; # Use number of available cores
pid /run/nginx.pid;

events {
    worker_connections 1024; # Max connections per worker
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Define the upstream group of FastAPI application servers
    # Docker Compose resolves the service name 'app' to the container IPs
    upstream fast_api_servers { # Renamed for clarity for FastAPI
        # Default load balancing strategy is round-robin
        # Point to the port Gunicorn/Uvicorn is listening on inside the app containers
        server app:8000; # Connect to the 'app' service on port 8000
    }

    server {
        listen 80; # Nginx listens on port 80 inside its container
        server_name localhost; # Or your actual domain name

        # Increase max body size for file uploads (should match server limits if any)
        client_max_body_size 16M;

        location / {
            # Pass requests to the upstream FastAPI group
            proxy_pass http://fast_api_servers; # Use the defined upstream

            # Set headers to pass necessary information to the FastAPI app
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Optional: Adjust proxy timeouts if needed for potentially long OCR processing
            # proxy_connect_timeout 75s;
            # proxy_send_timeout 300s;
            # proxy_read_timeout 300s;
        }
    }
}